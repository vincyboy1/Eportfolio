<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="Circuit Grind: a 163-question CEC 2024 and structured-cabling study game." />
  <title>Circuit Grind | Loading</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#06101d;color:#edf8ff}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#12364a,#06101d 45%,#030913)}.loader{width:min(460px,calc(100% - 36px));padding:32px;border:1px solid rgba(151,213,255,.2);border-radius:24px;background:rgba(13,28,46,.88);box-shadow:0 24px 80px rgba(0,0,0,.4)}.brand{color:#4be3ff;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{margin:12px 0 10px;font-size:clamp(2rem,8vw,3.3rem);letter-spacing:-.05em}p{color:#91a9bb;line-height:1.6}.bar{height:6px;margin-top:22px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.08)}.bar::after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#4be3ff,#89ffb4);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(125%)}}
  </style>
</head>
<body>
  <main class="loader" id="loader">
    <div class="brand">ϟ Circuit Grind</div>
    <h1>Loading study arena.</h1>
    <p>Unpacking 163 questions, five game modes, explanations, statistics, and offline support.</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <script>
    (async()=>{
      const files=["payload/01.txt","payload/02.txt","payload/03.txt","payload/04.txt","payload/05.txt"];
      try{
        if(!("DecompressionStream" in window)) throw new Error("This browser needs an update before it can run Circuit Grind.");
        const parts=await Promise.all(files.map(async file=>{const response=await fetch(file,{cache:"no-store"});if(!response.ok)throw new Error(`Could not load ${file}.`);return response.text()}));
        const binary=atob(parts.join(""));
        const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const page=await new Response(stream).text();
        document.open();document.write(page);document.close();
      }catch(error){
        console.error(error);
        document.getElementById("loader").innerHTML=`<div class="brand">Circuit Grind</div><h1>Load failed.</h1><p>${String(error.message||error)} Reload the page after updating the browser.</p>`;
      }
    })();
  </script>
</body>
</html>
